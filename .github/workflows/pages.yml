name: Publish shared Karing rules

on:
  push:
    branches: [main]
    paths:
      - rules.json
      - build.py
      - update_telegram.py
      - .github/workflows/pages.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      archive_snapshot:
        description: Save a verified Telegram source snapshot now
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and verify rule sets
        run: |
          python3 build.py
          python3 build.py --check
      - name: Refresh and verify official Telegram networks
        run: |
          python3 update_telegram.py
          python3 update_telegram.py --check
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only generated rule sets
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  archive:
    name: Archive verified Telegram source monthly
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current main with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check snapshot age
        id: snapshot
        env:
          FORCE_SNAPSHOT: ${{ inputs.archive_snapshot || false }}
        run: |
          python3 - <<'PY'
          import os, subprocess, time
          from update_telegram import snapshot_due
          last = subprocess.check_output(
              ['git', 'log', '-1', '--format=%ct', '--', 'dist/telegram-status.json'],
              text=True,
          ).strip()
          needed = os.environ['FORCE_SNAPSHOT'] == 'true' or snapshot_due(
              int(last) if last else None, time.time()
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'needed={str(needed).lower()}\n')
          print(f'Archive needed: {needed}')
          PY
      - name: Refresh and validate snapshot
        if: steps.snapshot.outputs.needed == 'true'
        run: |
          python3 update_telegram.py
          python3 update_telegram.py --check
      - name: Commit verified snapshot
        if: steps.snapshot.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/telegram.json dist/telegram-status.json
          git commit -m 'Archive verified Telegram networks snapshot'
          git push origin HEAD:main
